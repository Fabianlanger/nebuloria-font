<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Redesign Compare</title><style>
@font-face{font-family:Old;src:url(../build/prev/nebuloria-v1.0.woff2) format("woff2")}
@font-face{font-family:New;src:url(nebuloria-regular.woff2) format("woff2")}
body{margin:0;background:#fbf9f4;color:#1d1b18;font-family:system-ui,sans-serif}
.row{display:grid;grid-template-columns:110px 1fr 1fr;align-items:center;padding:14px 32px;border-bottom:1px solid #e3ddd0}

.ctx .o,.ctx .n{font-size:56px}

<div class="row"><span></span><span class="h">before (v1.0)</span><span class="h">after (v1.1)</span></div>
<div class="row"><span class="h">capitals</span><span class="o">CGKMVWXY</span><span class="n">CGKMVWXY</span></div>
<div class="row"><span class="h">lowercase</span><span class="o">bmnux</span><span class="n">bmnux</span></div>
<div class="row ctx"><span class="h">in words</span><span class="o">Making Waves<br>Cabin Number</span><span class="n">Making Waves<br>Cabin Number</span></div>
<div class="row ctx"><span class="h">with family</span><span class="o">BCDEFGH mnuxabd</span><span class="n">BCDEFGH mnuxabd</span></div>
</body></html>
